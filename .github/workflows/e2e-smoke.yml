name: E2E Smoke (Daily)

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  smoke:
    name: "Frontend: E2E Smoke"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
          --name virtual-team-redis
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt --quiet
      - run: npm ci --prefer-offline --no-audit
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend
      - name: Start backend
        run: |
          PYTHONPATH=. AUTH_MODE=legacy CHECKPOINTER_BACKEND=memory RATE_LIMIT=9999 \
            REDIS_URL=redis://localhost:6379/1 AUTH_SECRET=ci-e2e-secret \
            python3 -m uvicorn backend.core.app:app --host 0.0.0.0 --port 8081 > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/api/models > /dev/null 2>&1; then break; fi; sleep 1
          done
      - name: Seed E2E user
        run: |
          # 等 auth 端点就绪（/api/models 就绪不代表 auth 路由已可用），带重试
          for i in $(seq 1 15); do
            if curl -sf -X POST http://localhost:8081/api/auth/send-register-code \
              -H 'Content-Type: application/json' -d '{"email":"e2e-user@example.com"}' > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          code=$(docker exec virtual-team-redis redis-cli -n 1 GET 'auth:verify:e2e-user@example.com' | tr -d '"')
          if [ -z "$code" ]; then echo "❌ verify code not found"; cat /tmp/backend.log | tail -20; exit 1; fi
          curl -sf -X POST http://localhost:8081/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"e2e-user@example.com\",\"code\":\"$code\",\"password\":\"Test1234!\"}" > /dev/null
      - name: Start frontend
        working-directory: frontend
        run: |
          npx vite --port 5174 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5174 > /dev/null 2>&1; then break; fi; sleep 1
          done
      - name: Run Playwright E2E smoke tests
        working-directory: frontend
        run: PLAYWRIGHT_BASE_URL=http://localhost:5174 npx playwright test --project=chromium 2>&1 | tail -30
      - name: Stop services
        if: always()
        run: kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true
