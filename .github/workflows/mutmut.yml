name: Mutation Testing (mutmut)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  mutmut:
    name: "Backend: Mutation Score"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/cjlodyssey/agent-studio/ci-runner:latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install mutmut --quiet
      # 范围：先 core/infra（纯逻辑、跑得快）。services/ 突变多、单轮 ~105s，
      # 等 core/infra 达标后再扩（见 pyproject [tool.mutmut] 注释）。
      - name: Run mutation tests (core/infra)
        run: |
          mutmut run \
            --source-paths backend/src/core/infra \
            --runner "env PYTHONPATH=backend/src python3 -m pytest -p no:cacheprovider -q --no-header" 2>&1 | tail -40
      - name: Enforce score threshold (60%)
        run: |
          score=$(mutmut results | grep -oP 'Mutation score: \K[0-9.]+' || echo 0)
          echo "Mutation score: ${score}%"
          python3 - "$score" <<'PY'
          import sys
          threshold = 60.0
          score = float(sys.argv[1])
          if score < threshold:
              print(f"❌ Mutation score {score}% below threshold {threshold}%")
              sys.exit(1)
          print(f"✅ Mutation score {score}% >= {threshold}%")
          PY
