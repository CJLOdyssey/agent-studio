[project]
name = "agent-studio"
version = "0.1.0"
description = "AI Agent management platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"backend/src/routers/*.py" = ["B008"]
"backend/src/auth/auth_rbac.py" = ["F401"]
"backend/tests/*.py" = ["E501", "SIM117", "N806"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_unused_ignores = true
# backend/src 作为顶层模块根（core/broker/repository 等，与运行时 PYTHONPATH=backend/src 一致）
mypy_path = ["backend/src", "backend/stubs"]
exclude = ["backend/tests/", "backend/stubs/", "backend/alembic/", "backend/src/system_team/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = ["-n", "auto", "--dist", "worksteal", "--reruns=2", "--reruns-delay=1"]
asyncio_mode = "auto"
markers = [
    "benchmark: marks performance benchmark tests (not run in default CI)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "env: marks tests that need specific environment variables",
    "integration: marks tests that require a running backend + Docker stack (deselect with '-m \"not integration\"')",
    "requirement(req_id): mark test as covering a specific requirement",
    "unit: marks unit tests (fast, no external dependencies)",
    "smoke: marks smoke tests (basic connectivity checks)",
    "regression: marks regression tests (edge cases and validation)",
    "flaky: marks tests as flaky (retried automatically via pytest-rerunfailures)",
    "xdist_group: marks tests that must run in the same xdist worker (e.g. shared state, ordering)",
]
filterwarnings = [
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::DeprecationWarning:langevals_*",
    "ignore::UserWarning:langchain.*",
    "ignore::ImportWarning:langgraph.*",

]

[tool.coverage.run]
source = ["backend/src"]
omit = [
    "backend/tests/*",
    "backend/thinking_tree/*",
    "backend/system_team/*",
    "backend/main.py",
    "backend/checkpoint/*",
    "backend/rag/rag_store.py",
    "backend/graph/agent_graph.py",
]

[tool.bandit]
exclude_dirs = ["backend/tests", ".venv", ".opencode"]
skips = [
    "B101",  # assert — tests/ is already excluded; remaining asserts are intentional defensive checks
    "B102",  # exec — sandboxed tool code validator runs with empty __builtins__ (no arbitrary code execution)
    "B104",  # 0.0.0.0 — required for Docker container networking; not exposed to public internet
    "B608",  # SQL injection — false positive: all SQL uses parameterized text() with params= bound variables
]

[tool.bandit.asserts]


[tool.coverage.report]
fail_under = 89
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
# CI 硬门禁运行范围：core/infra/ + services/（纯逻辑、单测覆盖）。
# 引擎（graph/workflow/checkpoint）依赖 langgraph 重 mock，逐步扩量（见 2026-08-05 plan P5）。
paths_to_mutate = ["backend/src/"]
exclude_paths = [
    "backend/system_team/",
    "backend/thinking_tree/",
    "backend/checkpoint/",
    "backend/graph/",
]
# mutmut 不以 shell 执行 runner（PYTHONPATH=x python3 会直接 FileNotFoundError），
# 必须用 env 前缀；且不能用 -x（首个失败突变会中断整轮评估，score 失真）。
test_runner = "env PYTHONPATH=backend/src python3 -m pytest -p no:cacheprovider -q --no-header"
score_threshold = 60

